name: Automated Daily YouTube Shorts Publisher

on:
  workflow_dispatch:
    inputs:
      privacy_status:
        description: 'Upload Privacy Status'
        required: true
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  publish_daily_short:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify FFmpeg
        run: |
          which ffmpeg && ffmpeg -version || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg)

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Shorts Pipeline
        env:
          PYTHONPATH: .
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRETS_JSON: ${{ secrets.YT_CLIENT_SECRETS_JSON }}
        run: |
          python src/workflows/daily_shorts_pipeline.py "${{ inputs.privacy_status || 'public' }}"

      - name: Commit and push publication log
        run: |
          git config --global user.name "Apex Daily Autopilot"
          git config --global user.email "autopilot@apexenterprise.studio"
          git add data/daily_shorts_log.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(autopilot): Record published daily short" && git push)
